name: ci

# Typecheck/lint/test on every push and PR — separate from release.yml,
# which only builds installers on a version tag.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  alleycat:
    name: Alleycat
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # The hardware tests need Resolume Alley and are gated behind
      # ALLEYCAT_HW=1, so they skip here rather than fail.
      - name: Test
        run: npm run test

      - name: Build and check the bundle wiring
        run: npm run build

      - name: Icons match their generators
        # The tray icon is committed as base64 inside src/main/trayIcon.ts and the
        # app icon as build/icon.png; both are generated, and a hand-edit would
        # make the app and its generator disagree silently.
        #
        # Compares the RGBA pixels via build/icons.sha256, NOT the PNG bytes:
        # zlib's deflate output differs between versions, so the identical
        # drawing encodes to 281 bytes locally and 283 on this runner, and a
        # byte-level diff fails on every machine that is not the author's.
        run: |
          node scripts/make-tray-icon.mjs --check
          node scripts/make-app-icon.mjs --check
