name: ci

# Typecheck/lint/test on every push and PR — separate from release.yml,
# which only builds installers on a version tag.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  alleycat:
    name: Alleycat
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # The hardware tests need Resolume Alley and are gated behind
      # ALLEYCAT_HW=1, so they skip here rather than fail.
      - name: Test
        run: npm run test

      - name: Icons are reproducible from their generators
        # The tray icon is committed as base64 inside src/main/trayIcon.ts and the
        # app icon as build/icon.png. Both are generated. If someone edits either
        # by hand the app and the generator disagree silently, so regenerate and
        # fail on any diff.
        run: |
          node scripts/make-tray-icon.mjs
          node scripts/make-app-icon.mjs
          git diff --exit-code src/main/trayIcon.ts resources/trayTemplate.png build/icon.png
